<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Salary Tracker</title>
    <style>
        /* Clean, Minimalist & Professional Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafbfc;
            padding: 20px 10px;
            color: #24292e;
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #eaecef;
        }
        
        /* Header Layout */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 12px;
        }
        .app-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1b1f23;
        }
        .settings-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .settings-btn:hover {
            transform: rotate(45deg);
        }

        /* Smart Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f6f8fa;
            padding: 12px 8px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #eaecef;
        }
        .stat-card h4 {
            font-size: 11px;
            color: #586069;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .stat-card p {
            font-size: 16px;
            font-weight: 600;
        }
        .stat-card.total-salary {
            grid-column: 1 / -1;
            background: #f0fdf4;
            border-color: #bbf7d0;
            padding: 16px;
        }
        .stat-card.total-salary h4 { color: #166534; }
        .stat-card.total-salary p { color: #15803d; font-size: 24px; }

        /* Eye Button for Privacy */
        .eye-btn {
            background: transparent;
            border: none;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .eye-btn:hover {
            background: #dcfce7;
        }

        /* Sleek Actions */
        .action-card {
            background: #ffffff;
            margin-bottom: 24px;
        }
        .date-picker-wrap {
            margin-bottom: 12px;
        }
        .date-picker-wrap input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            font-size: 14px;
            color: #24292e;
            outline: none;
        }
        .date-picker-wrap input:focus {
            border-color: #0366d6;
            box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.3);
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button.btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        .btn-full { background: #2ea043; }
        .btn-full:hover { background: #2c974b; }
        .btn-half { background: #dbab09; color: #fff; }
        .btn-half:hover { background: #b08800; }
        .btn-absent { background: #d73a49; }
        .btn-absent:hover { background: #cb2431; }

        /* Modern Table */
        .history-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #24292e;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eaecef;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

            padding: 12px
